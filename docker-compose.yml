services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${PORT:-5678}:${PORT:-5678}"
    env_file:
      - .env
    environment:
      N8N_PORT: ${PORT:-5678}
      N8N_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: